name: Track Titan
description: 'Track Titan is a sim racing analytics and coaching platform that records
  in-game telemetry from simulators including iRacing, Assetto Corsa and ACC, the F1
  series, Automobilista 2, Forza Motorsport, and Le Mans Ultimate, turning laps into
  time-loss analysis, AI coaching feedback, auto-installed esports car setups, and
  structured Academy learning content for a community of over 295,000 sim racers on
  PC and console. Founded by former professional sim racer and Porsche coach Max
  Teichert and backed by investors including Partech, Track Titan is a consumer
  product and publishes no public developer API, SDK, or documentation surface as
  of July 2026 (api.tracktitan.io serves only an internal backend service).'
